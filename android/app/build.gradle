plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ggzin694.personalcyberai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ggzin694.personalcyberai'
        minSdk 23
        targetSdk 30
        versionCode 2
        versionName '0.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
